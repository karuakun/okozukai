name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  # ─── テスト ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore okozukai.sln
      - name: Build
        run: dotnet build okozukai.sln --no-restore -c Release
      - name: Test
        run: dotnet test okozukai.sln --no-build -c Release --logger trx

  # ─── API デプロイ（Azure Functions） ──────────────────────────
  deploy-api:
    name: Deploy API
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish API
        run: |
          dotnet publish src/Okozukai.Api/Okozukai.Api.csproj \
            -c Release -o ./publish/api
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: ./publish/api
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}

  # ─── Blazor WASM デプロイ（Azure Static Web Apps） ───────────
  deploy-web:
    name: Deploy Web
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish Blazor WASM
        run: |
          dotnet publish src/Okozukai.Web/Okozukai.Web.csproj \
            -c Release -o ./publish/web
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./publish/web/wwwroot
          skip_api_build: true
